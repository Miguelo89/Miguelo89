<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04120b"/><stop offset="1" stop-color="#0d2a1b"/>
    </linearGradient>
    <linearGradient id="ac" gradientUnits="userSpaceOnUse" x1="82" y1="0" x2="500" y2="0">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#effaf3}
      .m{font-family:'Cascadia Code',Consolas,monospace;fill:#8fb9a3}
      .cur{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .ln{stroke-dasharray:420;stroke-dashoffset:420;animation:d 1.6s .3s ease-out forwards}
      @keyframes d{to{stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g opacity=".07" stroke="#fff">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M200 0V300M400 0V300M600 0V300M800 0V300M1000 0V300"/>
  </g>
  <text x="80" y="118" class="m" font-size="20">// desarrollador full-stack</text>
  <text x="80" y="180" class="t" font-size="60" font-weight="700">Miguel Aponte</text>
  <path d="M82 206H500" stroke="url(#ac)" stroke-width="4" stroke-linecap="round" class="ln"/>
  <text x="80" y="248" class="m" font-size="20">software para negocios reales: restaurantes, tiendas y gimnasios<tspan class="cur" fill="#a3e635"> ▍</tspan></text>
</svg>
